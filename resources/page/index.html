<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>MNO</title>
  <style>
    @font-face { font-family: 'Barlow Semi Condensed'; font-weight: 500; font-display: swap; src: url(fonts/BarlowSemiCondensed-500.woff2) format('woff2'); }
    @font-face { font-family: 'Barlow Semi Condensed'; font-weight: 600; font-display: swap; src: url(fonts/BarlowSemiCondensed-600.woff2) format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-display: swap; src: url(fonts/IBMPlexMono-400.woff2) format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; font-display: swap; src: url(fonts/IBMPlexMono-500.woff2) format('woff2'); }
    /* Slide's palette: light by default, dark when the system is */
    :root {
      --panel: #cdcdcd; --band: #c2c2c2; --ink: #1c1c1c; --ink2: #4f4f4f; --dim: #5d5d5d;
      --hair: #a9a9a9; --acc: #75540a; --acc2: #2f6670; --line: var(--hair);
      --src-adsr2: #9a3f1c; --src-lfo2: #3b4f8f;
      --names: "Barlow Semi Condensed", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      color-scheme: light;
      font: 13px var(--names);
      background: var(--panel);
      color: var(--ink);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --panel: #161616; --band: #222; --ink: #dedede; --ink2: #bdbdbd; --dim: #8a8a8a;
        --hair: #3d3d3d; --acc: #ddc07e; --acc2: #8fc3cc;
        --src-adsr2: #e59a73; --src-lfo2: #9fb0e6;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 300px; min-height: 240px; overflow: hidden; }
    main { height: 100vh; display: grid; grid-template-rows: 116px minmax(0, 1fr); }

    .top-row {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(160px, 220px);
      border-bottom: 1px solid var(--line);
    }

    .rail {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 4px;
      padding: 4px 12px;
      border-right: 1px solid var(--line);
    }
    .module {
      appearance: none;
      position: relative;
      min-width: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      opacity: .55;
      cursor: pointer;
      font: 600 11px var(--names);
      letter-spacing: .08em;
    }
    .module:hover, .module:focus-visible { opacity: .78; }
    .module:focus-visible { outline: 1px solid currentColor; outline-offset: -2px; }
    .module[aria-current="page"] { opacity: .9; }
    .module::after {
      content: "";
      position: absolute;
      left: 50%; bottom: 2px;
      width: 12px; height: 2px;
      background: transparent;
      transform: translateX(-50%);
    }
    .module[aria-current="page"]::after { background: currentColor; }
    .module[data-source] { color: var(--src); touch-action: none; }
    /* one colour per modulation source */
    .module[data-source="adsr1"], .mod-ring[data-source="adsr1"], .mapping-adsr1 { --src: var(--acc); }
    .module[data-source="adsr2"], .mod-ring[data-source="adsr2"], .mapping-adsr2 { --src: var(--src-adsr2); }
    .module[data-source="lfo1"], .mod-ring[data-source="lfo1"], .mapping-lfo1 { --src: var(--acc2); }
    .module[data-source="lfo2"], .mod-ring[data-source="lfo2"], .mapping-lfo2 { --src: var(--src-lfo2); }
    /* mapping: the source lights, the rest of the rail steps back */
    .rail.mapping .module { opacity: .24; }
    .rail.mapping .module.mapping { opacity: 1; background: color-mix(in srgb, var(--src) 12%, transparent); }
    .module.mapping::after { width: 22px; background: var(--src); }
    /* knobs a source can modulate: thin rings, one per source, from 12 o'clock */
    .mod-knob { position: relative; width: 100%; max-width: 88px; justify-self: center; }
    .mod-knob compost-knob { max-width: none; }
    .mod-rings { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
    .mod-ring path { fill: none; stroke: var(--src); stroke-width: 1.5; stroke-linecap: square; }
    .mod-ring circle { fill: var(--src); }
    compost-knob.route { color: var(--src); --compost-accent: color-mix(in srgb, var(--src) 30%, transparent); }
    .route-arc path { stroke-width: 7px; stroke-linecap: butt; }
    compost-knob.route::part(cap) { border-color: var(--src); }
    .mod-knob.drop-target compost-knob::part(dial) { outline: 1px dashed var(--src); outline-offset: 6px; }
    .drag-ghost { position: fixed; z-index: 10; width: 10px; height: 10px; margin: -5px 0 0 -5px; background: var(--src); pointer-events: none; }
    .glyph { display: block; height: 32px; margin: 0 auto 1px; }
    .glyph path, .glyph polyline, .glyph line {
      fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
    }
    .keyboard-glyph .black-keys { fill: currentColor; stroke: none; }
    .glyph circle { fill: currentColor; }

    .workspace { min-height: 0; }
    compost-scope {
      width: 100%;
      height: 100%;
      --scope-height: 100%;
      --scope-background: var(--panel);
      --scope-grid: transparent;
      --scope-zero: transparent;
      --scope-trace: var(--ink);
      --scope-marker: var(--dim);
      --scope-label: var(--ink2);
      --scope-border: transparent;
    }
    .page { width: 100%; height: 100%; overflow: auto; }
    .page-header { height: 42px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .page-title { flex: 1; margin: 0; padding: 0 18px; color: var(--dim); font: 600 11px var(--names); letter-spacing: .12em; text-transform: uppercase; }
    .header-controls { height: 100%; display: flex; align-items: center; }
    .knobs { padding: 18px 10px 8px; display: grid; grid-template-columns: repeat(3, minmax(70px, 1fr)); gap: 6px 8px; align-items: start; }
    /* compost >= Sep 2026: controls take colour/font from the page and expose
       ::part() hooks instead of the old --knob-* palette. Reproduce the earlier
       MNO look (white arc on a dark cap, 76px dial, 7px ring) on top of that. */
    compost-knob {
      width: 100%; max-width: 88px; justify-self: center;
      color: var(--ink);              /* label, indicator, cap border, track tint */
      --compost-accent: var(--acc);   /* value arc */
      font-family: var(--names);
      --knob-dial-size: 76px;         /* old default geometry */
      --knob-ring-width: 7px;
    }
    compost-knob::part(cap) { background: var(--band); border-color: var(--hair); }
    compost-knob::part(value) { color: var(--dim); font-family: var(--mono); }
    compost-knob.compact { width: 58px; }
    /* Waveform pickers: a dark 42px button opening a compost-popup menu, in
       place of the native <select> that new compost's compost-select renders. */
    mno-select { display: block; width: 150px; height: 100%; color: var(--ink); --compost-accent: var(--acc); }
    .mno-select-button {
      appearance: none; box-sizing: border-box; width: 100%; height: 42px;
      padding: 0 28px 0 12px; text-align: left;
      border: 0; border-left: 1px solid var(--hair); border-radius: 0;
      background-color: var(--band); color: inherit; font: inherit; cursor: pointer;
      background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                        linear-gradient(135deg, currentColor 50%, transparent 50%);
      background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
      background-size: 5px 5px; background-repeat: no-repeat;
    }
    .mno-select-button:hover { background-color: var(--panel); }
    .mno-select-button:focus-visible { outline: 1px solid var(--acc); outline-offset: -1px; }
    compost-popup {
      --compost-popup-bg: var(--panel);
      --compost-popup-text: var(--ink);
      --compost-popup-border: var(--hair);
      --compost-popup-hover-bg: var(--band);
      --compost-popup-active-text: var(--acc);
      --compost-popup-font-size: 13px;
      --compost-popup-min-width: 150px;
    }
    compost-popup::part(menu) { border-radius: 0; }
    .toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); font: 600 11px var(--names); letter-spacing: .08em; }
    .header-controls .toggle { height: 100%; padding: 0 12px; border-left: 1px solid var(--line); }
    /* a square switch drawn in fine lines: an outline with a block that slides across */
    .toggle input {
      appearance: none; position: relative; margin: 0; width: 30px; height: 16px; cursor: pointer;
      border: 1px solid var(--ink2); border-radius: 0; background: transparent;
    }
    .toggle input::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; background: var(--dim);
    }
    .toggle input:checked { border-color: var(--acc); }
    .toggle input:checked::after { left: 16px; background: var(--acc); }
    .toggle input:focus-visible { outline: 1px solid var(--acc); outline-offset: 2px; }

    @media (max-width: 599px), (max-aspect-ratio: 1.12/1) {
      main { grid-template-rows: 104px minmax(0, 1fr); }
      .top-row { grid-template-columns: minmax(0, 1fr) minmax(118px, 35vw); }
      .glyph { height: 26px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="top-row">
      <nav class="rail" aria-label="Synth modules">
        <button class="module" data-page="osc1" aria-label="Oscillator 1">
          <svg class="glyph" data-visual="osc1" viewBox="0 0 48 28" aria-hidden="true"></svg>OSC 1
        </button>
        <button class="module" data-page="osc2" aria-label="Oscillator 2">
          <svg class="glyph" data-visual="osc2" viewBox="0 0 48 28" aria-hidden="true"></svg>OSC 2
        </button>
        <button class="module" data-page="filter" aria-label="Filter">
          <svg class="glyph" data-visual="filter" viewBox="0 0 48 28" aria-hidden="true"></svg>FILTER
        </button>
        <button class="module" data-page="adsr1" data-source="adsr1" aria-label="ADSR 1">
          <svg class="glyph" data-visual="adsr1" viewBox="0 0 48 28" aria-hidden="true"></svg>ADSR 1
        </button>
        <button class="module" data-page="adsr2" data-source="adsr2" aria-label="ADSR 2">
          <svg class="glyph" data-visual="adsr2" viewBox="0 0 48 28" aria-hidden="true"></svg>ADSR 2
        </button>
        <button class="module" data-page="lfo1" data-source="lfo1" aria-label="LFO 1">
          <svg class="glyph" data-visual="lfo1" viewBox="0 0 48 28" aria-hidden="true"></svg>LFO 1
        </button>
        <button class="module" data-page="lfo2" data-source="lfo2" aria-label="LFO 2">
          <svg class="glyph" data-visual="lfo2" viewBox="0 0 48 28" aria-hidden="true"></svg>LFO 2
        </button>
        <button class="module" data-page="keyboard" aria-label="Keyboard">
          <svg class="glyph keyboard-glyph" viewBox="0 0 48 28"><path d="M2.5 2.5 H45.5 V25.5 H2.5 Z M11.1 2.5 V25.5 M19.7 2.5 V25.5 M28.3 2.5 V25.5 M36.9 2.5 V25.5"/><path class="black-keys" d="M8.7 2.5 H13.5 V16.5 H8.7 Z M17.3 2.5 H22.1 V16.5 H17.3 Z M34.5 2.5 H39.3 V16.5 H34.5 Z"/></svg>KEYS
        </button>
      </nav>
      <compost-scope id="scope" trigger="off" samples-shown="256" value-range="1.5" aria-label="MNO output waveform"></compost-scope>
    </section>
    <section class="workspace">
      <section class="page" aria-live="polite">
        <div class="page-header">
          <h1 class="page-title" id="page-title">Oscillator 1</h1>
          <div class="header-controls" id="header-controls"></div>
        </div>
        <div class="knobs" id="knobs"></div>
      </section>
    </section>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
